apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
spec:
  # 1. Runs 2 replicas of the serving container
  replicas: 2
  
  # 2. Uses a rolling update strategy (maxSurge: 1, maxUnavailable: 0)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: model-serving

  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
        - name: serving
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          # 3. Sets resource requests (CPU: 500m, Memory: 1Gi) and limits (CPU: 1, Memory: 2Gi)
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          # 4. Liveness probe: GET /health every 10s, failure threshold 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3

          # 5. Readiness probe: GET /health every 5s, initial delay 15s
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

          # 6. Mounts the checkpoint PVC (read-only) at /app/checkpoints
          volumeMounts:
            - name: checkpoint-storage
              mountPath: /app/checkpoints
              subPath: checkpoints
              readOnly: true

      volumes:
        - name: checkpoint-storage
          persistentVolumeClaim:
            claimName: mlops-pvc
